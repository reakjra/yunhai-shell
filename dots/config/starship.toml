add_newline = false

format = """
$username$directory$fill$cmd_duration$git_branch$git_status$line_break$character"""

[character]
success_symbol = "[   ](bold fg:243)"
error_symbol = "[   ](bold fg:244)"

[package]
disabled = true

[username]
style_user = "bold bg:245 fg:bold 235"
format = "[](bold fg:245)[$user]($style)[](bold fg:245)[ 󰜥 ](bold fg:253)"
disabled = false
show_always = true

[hostname]
disabled = true

[directory]
home_symbol = "合"
read_only = " "
style = "bg:245 fg:bold 235"
truncation_length = 8
truncation_symbol = "••/"
format = '[](bold fg:245)[󰉋 $path]($style)[](bold fg:245)'

#old one
