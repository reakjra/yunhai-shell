#[directory.substitutions]
#"Desktop" = "  "
#"Documents" = "  "
#"Downloads" = "  "
#"Music" = " 󰎈 "
#"Pictures" = "  "
#"Videos" = "  "
#"GitHub" = " 󰊤 "

[git_branch]
style = "bg:251"
symbol = "󰘬"
truncation_length = 28
truncation_symbol = ""

format = " [](bold fg:251)[$symbol $branch(:$remote_branch)](fg:236 bg:251)[](bold fg:251)"

[git_status]
style = "bg:249 fg:238"
conflicted = ""
ahead = ""
behind = ""
diverged = ""
untracked = ""
stashed = "✔"
modified = ""
staged = " +$count"
renamed = " "
deleted = " "
format = ' [](bold fg:249)[$all_status$ahead_behind]($style)[](bold fg:249)'

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[PICKING](bold red)"

[cmd_duration]
min_time = 1000
format = '[ ](fg:250)[  ](fg:237 bg:250)[](fg:250 bg:252)[ $duration](fg:235 bg:252)[](fg:252)'

[line_break]
disabled = false

[memory_usage]
disabled = true

[time]
disabled = true
